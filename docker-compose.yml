# Local/field-test backend: Postgres+PostGIS, migrations, the API, and the admin web tool.
#
#   JWT_SECRET=$(openssl rand -hex 32) docker compose up --build
#
# Then point a tunnel (Cloudflare Tunnel, ngrok, …) at localhost:3000. TLS lives in the tunnel,
# not here — iOS ATS and Android both refuse cleartext, so the phone must reach an https URL
# (§6.8 wants TLS 1.3). The admin tool is at /admin/ on the same address; sign in with a key
# from `docker compose exec api node dist/jobs/grantAdmin.js --new-key`.

services:
  db:
    # PostGIS, not stock postgres: the schema has a GEOGRAPHY generated column and a GIST index.
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: arquest
      POSTGRES_PASSWORD: arquest
      POSTGRES_DB: ar_quest_trail
    ports:
      # Non-default host port, so this can't collide with a Postgres already on 5432.
      - '55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces a TCP check. Without it pg_isready talks to the Unix socket, which
      # answers during the image's init phase — before the TCP listener exists — so dependants
      # start against a refused connection.
      test: ['CMD-SHELL', 'pg_isready -U arquest -d ar_quest_trail -h 127.0.0.1 -p 5432']
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once and exits; the API waits for it to succeed rather than racing an unmigrated schema.
  migrate:
    build: &server-build
      # Repo root, so the image can include the admin web tool (admin-web/).
      context: .
      dockerfile: server/Dockerfile
    command: npm run migrate
    environment:
      DATABASE_URL: postgres://arquest:arquest@db:5432/ar_quest_trail
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build: *server-build
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://arquest:arquest@db:5432/ar_quest_trail
      PORT: 3000
      # No default on purpose. This process gets exposed to the public internet through a
      # tunnel, and a shipped placeholder secret would forge any player's session.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET, e.g. JWT_SECRET=$(openssl rand -hex 32) docker compose up}
      LOCATION_HISTORY_RETENTION_DAYS: ${LOCATION_HISTORY_RETENTION_DAYS:-90}
      # Optional: 3D terrain and buildings on the admin map (a free Cesium ion account's token).
      # Unset, the admin map is flat OpenStreetMap.
      CESIUM_ION_TOKEN: ${CESIUM_ION_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # SR-PRIV-01: delete raw location history past the retention window, once at start and then
  # daily (decision 2026-10-07). A plain loop rather than a cron daemon: nothing extra in the
  # image, and each run logs one JSON line (`docker compose logs purge`).
  purge:
    build: *server-build
    command: ['sh', '-c', 'while true; do node dist/jobs/purgeLocationHistory.js; sleep 86400; done']
    environment:
      DATABASE_URL: postgres://arquest:arquest@db:5432/ar_quest_trail
      LOCATION_HISTORY_RETENTION_DAYS: ${LOCATION_HISTORY_RETENTION_DAYS:-90}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
